      tags: [Planner]
      operationId: patchPlanner
      summary: Ubah planner (parsial)
      description: |
        Body parsial: field yang tidak dikirim tidak diubah, `{}` = no-op 200. `id` di body diabaikan.
        `type_id` / `starts_at` / `ends_at` dikirim `null` untuk dikosongkan.
