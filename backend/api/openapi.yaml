      description: "Ini sekaligus daftar item — tidak ada `GET /v1/planners/{id}/budget/items` terpisah."
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummaryResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/planners/{id}/budget/items:
    parameters:
      - $ref: "#/components/parameters/PlannerId"
    post:
      tags: [Planner]
      operationId: addBudgetItem
      summary: Tambah item budget
      description: |
        `category_id` harus kategori milik planner ini (salah → 404 `category`). `amount` IDR, `< 0` → 400.
        `day_id` hanya boleh saat `budget_mode` = `daily` (mode `event` → 400); hari asing → 404 `day`.
        Baca item lewat `GET /v1/planners/{id}/budget`.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/planners/{id}/budget/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/PlannerId"
      - $ref: "#/components/parameters/BudgetItemId"
    patch:
      tags: [Planner]
      operationId: patchBudgetItem
      summary: Ubah item budget
      description: |
        Body parsial, `{}` = no-op 200. Item bukan milik planner ini → 404 `budget_item`.
        `paid_at` RFC3339 = sudah dibayar, `null` = belum. Server tidak mengisi `now()` sendiri.
        `day_id` `null` = lepas dari hari; non-null hanya saat mode `daily`.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBudgetItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Planner]
      operationId: deleteBudgetItem
      summary: Hapus item budget
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Dihapus
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/planners/{id}/checklist:
    parameters:
      - $ref: "#/components/parameters/PlannerId"
    get:
      tags: [Planner]
      operationId: listChecklist
      summary: Daftar checklist
      description: "Urut `sort_order`, lalu judul."
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckItemListResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Planner]
      operationId: addChecklistItem
      summary: Tambah tugas checklist
      description: "`day_id` boleh di mode `event` — tugas menempel hari, bukan budget. Hari asing → 404 `day`."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/planners/{id}/checklist/{itemId}:
    parameters:
      - $ref: "#/components/parameters/PlannerId"
      - $ref: "#/components/parameters/ChecklistItemId"
    patch:
      tags: [Planner]
      operationId: patchChecklistItem
      summary: Ubah tugas checklist
      description: |
        Body parsial, `{}` = no-op 200. Dulu hanya `{done}` → 204; sekarang 200 + `{"data": CheckItem}`.
        Item bukan milik planner ini → 404 `checklist`. `day_id` / `due_at` `null` = dikosongkan.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCheckItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Planner]
      operationId: deleteChecklistItem
      summary: Hapus tugas checklist
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Dihapus
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/links:
    get:
      summary: List tautan; filter opsional invitation_id / planner_id
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: invitation_id
          schema: {type: string, format: uuid}
        - in: query
          name: planner_id
          schema: {type: string, format: uuid}
    post:
      security: [{bearerAuth: []}]
  /v1/links/{id}:
    delete:
      summary: Hapus tautan (undangan dan planner tetap ada)
      security: [{bearerAuth: []}]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LocationId:
      name: locationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GuestId:
      name: guestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InviterId:
      name: inviterId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GiftMethodId:
      name: methodId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GuestbookEntryId:
      name: entryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlannerId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlannerDayId:
      name: dayId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlannerSessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BudgetCategoryId:
      name: categoryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BudgetItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ChecklistItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RSVPToken:
      name: token
      in: path
      required: true
      schema: {type: string}
    InvitationSlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: "JSON rusak (`invalid_json`) atau validasi (`invalid_input` / `invalid_id`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InvalidId:
      description: Path UUID rusak
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: {code: invalid_id, message: invalid id}
    Unauthorized:
      description: JWT hilang atau tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: {code: unauthorized, message: missing bearer token}
    EntitlementDenied:
      description: Kuota atau template premium
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            invitationQuota:
              value:
                error: {code: entitlement_denied, message: max_active_invitations quota exceeded}
            guestQuota:
              value:
                error: {code: entitlement_denied, message: max_guests_per_invitation quota exceeded}
            premiumTemplate:
              value:
                error: {code: entitlement_denied, message: premium_templates not included in current plan}
            plannerQuota:
              value:
                error: {code: entitlement_denied, message: max_active_planners quota exceeded}
            plannerDaily:
              value:
                error: {code: entitlement_denied, message: planner_daily not included in current plan}
    NotFound:
      description: Resource tidak ada atau bukan milik host; RSVP token/slug unpublished
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            invitation:
              value:
                error: {code: not_found, message: invitation not found}
            plannerChild:
              summary: "Anak planner: day / session / category / budget_item / checklist"
              value:
                error: {code: not_found, message: budget_item not found}
    DayDateConflict:
      description: Tanggal hari sudah ada di planner ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: {code: conflict, message: day date already exists}
    PaymentUnavailable:
      description: Adapter Duitku tidak dikonfigurasi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: {code: payment_unavailable, message: Duitku is not configured}
    InternalError:
      description: Kesalahan server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: {code: internal, message: internal server error}
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    EventType:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, example: wedding}
        name: {type: string}
        invitation_schema:
          type: object
          additionalProperties: true
          description: "Petunjuk slot content, contoh `{\"slots\":[\"couple\",\"rundown\"]}`. Bukan JSON Schema yang dienforce."
        planner_categories:
          description: Default kategori planner; bukan bagian undangan
          nullable: true
    Template:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        type_id: {type: string, format: uuid}
        name: {type: string}
        tier:
          type: string
          enum: [free, premium]
        version: {type: integer}
        slots:
          description: JSON array nama slot template
        locked:
          type: boolean
          description: true jika premium dan caller tidak berhak
    Invitation:
      type: object
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        type_id: {type: string, format: uuid}
        template_id: {type: string, format: uuid}
        template_version: {type: integer}
        slug:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
        title: {type: string}
        content:
          type: object
          additionalProperties: true
          description: Objek bebas. Key mengikuti invitation_schema tipe acara; server tidak validasi.
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
    Location:
      type: object
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        venue_name: {type: string}
        address: {type: string}
        maps_url: {type: string, description: URL Google/Apple Maps yang ditempel}
        lat:
          type: number
          format: double
          nullable: true
          description: Tidak diisi otomatis
        lng:
          type: number
          format: double
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        sort_order: {type: integer}
    Guest:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        group: {type: string}
        rsvp_token: {type: string}
        status:
          type: string
          enum: [draft, invited, opened, accepted, declined]
        plus_ones: {type: integer}
        message: {type: string, description: Pesan RSVP, bukan buku ucapan}
        rsvp_at:
          type: string
          format: date-time
          nullable: true
    Inviter:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string}
        sort_order: {type: integer}
    Media:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [gallery, music]
        original_name: {type: string}
        content_type: {type: string}
        url:
          type: string
          example: /v1/public/media/00000000-0000-0000-0000-000000000001
          description: Path relatif, bukan URL absolut
        caption: {type: string}
        sort_order: {type: integer}
    GuestbookEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        message: {type: string}
        created_at: {type: string, format: date-time}
    GiftMethod:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [bank, ewallet, duitku]
        label: {type: string}
        account_name: {type: string}
        account_number: {type: string}
        is_active: {type: boolean}
        sort_order: {type: integer}
    GiftPayment:
      type: object
      properties:
        id: {type: string, format: uuid}
        method_id: {type: string, format: uuid}
        sender_name: {type: string}
        message: {type: string}
        amount_idr:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, paid, failed, expired]
        merchant_order_id: {type: string}
        duitku_reference: {type: string}
        payment_url: {type: string}
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at: {type: string, format: date-time}
    PublicRSVPPage:
      type: object
      properties:
        guest_name: {type: string}
        title: {type: string}
        content:
          type: object
          additionalProperties: true
        status:
          type: string
          description: Status tamu setelah GET (biasanya opened, atau accepted/declined)
        locations:
          type: array
          items: {$ref: "#/components/schemas/Location"}
          nullable: true
        inviters:
          type: array
          items: {$ref: "#/components/schemas/Inviter"}
        gallery:
          type: array
          items: {$ref: "#/components/schemas/Media"}
        music:
          allOf:
            - $ref: "#/components/schemas/Media"
          nullable: true
        template_id: {type: string, format: uuid}
        guestbook:
          type: array
          items: {$ref: "#/components/schemas/GuestbookEntry"}
        gifts:
          type: array
          items: {$ref: "#/components/schemas/GiftMethod"}
          description: Metode aktif saja
    PublicInvitationPage:
      type: object
      properties:
        title: {type: string}
        content:
          type: object
          additionalProperties: true
        slug: {type: string}
        locations:
          type: array
          items: {$ref: "#/components/schemas/Location"}
          nullable: true
        inviters:
          type: array
          items: {$ref: "#/components/schemas/Inviter"}
        gallery:
          type: array
          items: {$ref: "#/components/schemas/Media"}
        music:
          allOf:
            - $ref: "#/components/schemas/Media"
          nullable: true
        template_id: {type: string, format: uuid}
        guestbook:
          type: array
          items: {$ref: "#/components/schemas/GuestbookEntry"}
        gifts:
          type: array
          items: {$ref: "#/components/schemas/GiftMethod"}
    CreateInvitationRequest:
      type: object
      required: [title, template_id]
      properties:
        title: {type: string}
        template_id: {type: string, format: uuid}
        content:
          type: object
          additionalProperties: true
    PatchInvitationRequest:
      type: object
      properties:
        title: {type: string}
        content:
          type: object
          additionalProperties: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    SetTemplateRequest:
      type: object
      required: [template_id]
      properties:
        template_id: {type: string, format: uuid}
    CreateGuestRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        group: {type: string}
    PatchLocationRequest:
      type: object
      description: Semua field opsional. Jangan geocode maps_url.
      properties:
        label: {type: string}
        venue_name: {type: string}
        address: {type: string}
        maps_url: {type: string}
        lat: {type: number, format: double, nullable: true}
        lng: {type: number, format: double, nullable: true}
        starts_at: {type: string, format: date-time, nullable: true}
        sort_order: {type: integer}
    PatchGuestRequest:
      type: object
      description: "Semua opsional. status host hanya draft|invited. Jangan kirim rsvp_token."
      properties:
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        group: {type: string}
        status:
          type: string
          enum: [draft, invited]
    PatchGuestbookRequest:
      type: object
      properties:
        name: {type: string, maxLength: 80}
        message: {type: string, maxLength: 2000}
    PatchInviterRequest:
      type: object
      description: Semua opsional. name jika dikirim tidak boleh kosong setelah trim. role kosong boleh.
      properties:
        name: {type: string}
        role: {type: string}
        sort_order: {type: integer}
    PatchGalleryRequest:
      type: object
      description: Hanya caption. Omit = tidak diubah. String kosong = hapus caption. Jangan kirim file.
      properties:
        caption: {type: string}
    CreateInviterRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        role: {type: string}
        sort_order: {type: integer}
    CreateGiftMethodRequest:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [bank, ewallet, duitku]
        label: {type: string}
        account_name: {type: string}
        account_number: {type: string}
        sort_order: {type: integer}
    SubmitRSVPRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, declined]
        message: {type: string}
        plus_ones: {type: integer, default: 0}
    CreateGuestbookRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          description: Wajib di preview slug. Opsional di RSVP-token (default nama tamu).
        message:
          type: string
          maxLength: 2000
    CreatePublicGiftRequest:
      type: object
      required: [method_id, amount_idr]
      properties:
        method_id: {type: string, format: uuid}
        amount_idr:
          type: integer
          format: int64
          minimum: 1
        sender_name: {type: string}
        message: {type: string}
    EventTypeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/EventType"}
          nullable: true
    TemplateListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Template"}
          nullable: true
    InvitationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Invitation"}
    InvitationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Invitation"}
          nullable: true
    LocationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Location"}
    LocationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Location"}
          nullable: true
    GuestResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Guest"}
    GuestListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Guest"}
          nullable: true
    InviterResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Inviter"}
    InviterListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Inviter"}
    MediaResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Media"}
    MediaListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Media"}
    MusicResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Media"
          nullable: true
    GuestbookResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/GuestbookEntry"}
    GuestbookListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/GuestbookEntry"}
    GiftMethodResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/GiftMethod"}
    GiftMethodListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/GiftMethod"}
    GiftPaymentResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/GiftPayment"}
    GiftPaymentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/GiftPayment"}
    PublicRSVPResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/PublicRSVPPage"}
    PublicInvitationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/PublicInvitationPage"}
    Planner:
      type: object
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        type_id: {type: string, format: uuid, nullable: true, description: Tipe acara katalog; opsional}
        title: {type: string, example: Nikahan Sep & Dina}
        budget_mode: {type: string, enum: [event, daily]}
        currency: {type: string, example: IDR}
        status: {type: string, enum: [active, archived]}
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: Tanggal kalender (kolom DATE); jam diabaikan server
        ends_at: {type: string, format: date-time, nullable: true}
    CreatePlannerRequest:
      type: object
      required: [title]
      properties:
        title: {type: string}
        budget_mode: {type: string, enum: [event, daily], default: event}
        type_id: {type: string, format: uuid, nullable: true}
        categories:
          type: array
          nullable: true
          items: {type: string}
          description: Nama kategori awal; kosong + `type_id` → dicopy dari `event_types.planner_categories`
    PatchPlannerRequest:
      type: object
      description: "Field yang tidak dikirim tidak diubah. `type_id` / `starts_at` / `ends_at` menerima `null` untuk dikosongkan."
      properties:
        title: {type: string, description: Trim; kosong → 400}
        budget_mode: {type: string, enum: [event, daily]}
        type_id: {type: string, format: uuid, nullable: true}
        starts_at: {type: string, format: date-time, nullable: true}
        ends_at: {type: string, format: date-time, nullable: true, description: Tanggal sebelum `starts_at` → 400}
    PlannerDay:
      type: object
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date-time, description: Tanggal kalender; unik per planner}
        label: {type: string, example: Akad}
        sort_order: {type: integer}
    CreatePlannerDayRequest:
      type: object
      required: [date]
      properties:
        date: {type: string, format: date-time}
        label: {type: string}
    PatchPlannerDayRequest:
      type: object
      properties:
        date: {type: string, format: date-time}
        label: {type: string, description: String kosong diperbolehkan}
        sort_order: {type: integer}
    PlannerSession:
      type: object
      description: Sesi rundown di dalam satu hari planner
      properties:
        id: {type: string, format: uuid}
        day_id: {type: string, format: uuid}
        title: {type: string, example: Akad}
        starts_at:
          type: string
          example: "09:00:00"
          description: Jam dinding `HH:MM:SS` (kolom TIME), bukan RFC3339
        ends_at:
          type: string
          nullable: true
          example: "11:30:00"
          description: "`null` = sesi tanpa jam selesai"
        pic_name: {type: string, example: Bu Rina, description: Teks bebas; bukan id user atau vendor}
        sort_order: {type: integer}
    CreatePlannerSessionRequest:
      type: object
      required: [title, starts_at]
      properties:
        title: {type: string, description: Trim; kosong → 400}
        starts_at: {type: string, example: "09:00", description: "`\"HH:MM\"` atau `\"HH:MM:SS\"`"}
        ends_at: {type: string, nullable: true, example: "11:30", description: Lebih awal dari `starts_at` → 400}
        pic_name: {type: string, default: ""}
        sort_order: {type: integer, default: 0}
    PatchPlannerSessionRequest:
      type: object
      description: "Field yang tidak dikirim tidak diubah. `ends_at` menerima `null` untuk dikosongkan."
      properties:
        title: {type: string, description: Trim; kosong → 400}
        starts_at: {type: string, example: "13:00"}
        ends_at: {type: string, nullable: true, example: "16:30"}
        pic_name: {type: string, description: String kosong = hapus nama PIC}
        sort_order: {type: integer}
    BudgetCategory:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: Katering}
        sort_order: {type: integer}
    CreateBudgetCategoryRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
    PatchBudgetCategoryRequest:
      type: object
      properties:
        name: {type: string, description: Trim; kosong → 400}
        sort_order: {type: integer}
    BudgetItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        day_id: {type: string, format: uuid, nullable: true, description: Hanya terisi di mode `daily`}
        name: {type: string}
        amount: {type: integer, format: int64, description: IDR, example: 25000000}
        paid_at: {type: string, format: date-time, nullable: true, description: Terisi = sudah dibayar}
        note: {type: string}
    CreateBudgetItemRequest:
      type: object
      required: [category_id, name]
      properties:
        category_id: {type: string, format: uuid}
        name: {type: string}
        amount: {type: integer, format: int64, default: 0}
        day_id: {type: string, format: uuid, nullable: true}
        note: {type: string}
    PatchBudgetItemRequest:
      type: object
      description: "`day_id` / `paid_at` menerima `null` untuk dikosongkan; key absen tidak mengubah apa pun."
      properties:
        category_id: {type: string, format: uuid, description: Harus kategori planner yang sama}
        day_id: {type: string, format: uuid, nullable: true}
        name: {type: string, description: Trim; kosong → 400}
        amount: {type: integer, format: int64, description: "`< 0` → 400"}
        paid_at: {type: string, format: date-time, nullable: true}
        note: {type: string}
    BudgetSummary:
      type: object
      description: Ringkasan sekaligus daftar item per kategori
      properties:
        budget_mode: {type: string, enum: [event, daily]}
        currency: {type: string, example: IDR}
        total: {type: integer, format: int64, description: Jumlah semua item (IDR)}
        paid: {type: integer, format: int64, description: Jumlah item yang punya `paid_at`}
        categories:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/BudgetCategory"
              - type: object
                properties:
                  items:
                    type: array
                    nullable: true
                    items: {$ref: "#/components/schemas/BudgetItem"}
                  total: {type: integer, format: int64}
                  paid: {type: integer, format: int64}
    CheckItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        day_id: {type: string, format: uuid, nullable: true, description: Boleh terisi di mode `event`}
        title: {type: string}
        done: {type: boolean}
        due_at: {type: string, format: date-time, nullable: true}
        sort_order: {type: integer}
    CreateCheckItemRequest:
      type: object
      required: [title]
      properties:
        title: {type: string}
        day_id: {type: string, format: uuid, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
        sort_order: {type: integer, default: 0}
    PatchCheckItemRequest:
      type: object
      description: "`day_id` / `due_at` menerima `null` untuk dikosongkan; key absen tidak mengubah apa pun."
      properties:
        title: {type: string, description: Trim; kosong → 400}
        day_id: {type: string, format: uuid, nullable: true}
        done: {type: boolean}
        due_at: {type: string, format: date-time, nullable: true}
        sort_order: {type: integer}
    PlannerResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Planner"}
    PlannerListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          nullable: true
          items: {$ref: "#/components/schemas/Planner"}
    PlannerDayResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/PlannerDay"}
    PlannerDayListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          nullable: true
          items: {$ref: "#/components/schemas/PlannerDay"}
    PlannerSessionResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/PlannerSession"}
    PlannerSessionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          nullable: true
          items: {$ref: "#/components/schemas/PlannerSession"}
    BudgetCategoryResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BudgetCategory"}
    BudgetCategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          nullable: true
          items: {$ref: "#/components/schemas/BudgetCategory"}
    BudgetItemResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BudgetItem"}
    BudgetSummaryResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BudgetSummary"}
    CheckItemResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/CheckItem"}
    CheckItemListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          nullable: true
          items: {$ref: "#/components/schemas/CheckItem"}
